name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Checked existing issues
      options:
        - label: I searched existing issues and didn't find this already reported
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Vortex version / commit SHA
      placeholder: e.g. 0.1.0-SNAPSHOT or a git commit hash
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: Which module?
      options:
        - core
        - openapi
        - k6
        - ai
        - persistence
        - app
        - web (frontend)
        - examples/demo-service
        - not sure
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The minimal steps needed to reproduce the issue
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
    validations:
      required: false
