name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the real problem you're hitting, not just the feature you want
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: Which module is this scoped to?
      options:
        - core
        - openapi
        - k6
        - ai
        - persistence
        - app
        - web (frontend)
        - examples/demo-service
        - not sure
    validations:
      required: false
