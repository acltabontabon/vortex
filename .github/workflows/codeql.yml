name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # Autobuild is unreliable against a multi-module reactor with frontend-maven-plugin wired
      # into generate-resources, so build explicitly instead. JS/TS analysis is source-scanning
      # and needs no build step.
      - name: Build (java-kotlin only)
        if: matrix.language == 'java-kotlin'
        run: ./mvnw -B -DskipTests clean package

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
