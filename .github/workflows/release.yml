name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Builds and attaches the jar as-is; this does not bump or validate the POM's own version
      # against the pushed tag. Run `./mvnw versions:set -DnewVersion=X.Y.Z` before tagging if the
      # jar's internal version metadata should match the release.
      - name: Build runnable jar
        run: ./mvnw -B -pl modules/app -am package -DskipTests

      - name: Verify jar exists
        run: test -f modules/app/target/vortex.jar

      - uses: softprops/action-gh-release@v3
        with:
          files: modules/app/target/vortex.jar
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
