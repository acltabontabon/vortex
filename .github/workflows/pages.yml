name: Pages

on:
  # The Release workflow publishes releases using the default GITHUB_TOKEN, and GitHub
  # suppresses further workflow_dispatch-style events (like `release: published`) from
  # token-authored actions to prevent recursive runs. Chaining off `workflow_run` instead
  # is the standard workaround: it reacts to the Release run itself completing, regardless
  # of which token drove it.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Build the site
        working-directory: www
        run: |
          npm ci
          npm run build

      # Fetching the latest release jar here and publishing it alongside the static site
      # gives visitors a direct download from the landing page itself, without sending
      # them to the GitHub Releases page first. Written into dist/ (the build output)
      # rather than the www/ source, and after the build so `npm run build`'s
      # emptyOutDir doesn't wipe it back out.
      - name: Bundle latest release jar into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "$TAG" ]; then
            echo "No releases found yet; deploying the site without a bundled jar." >&2
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'vortex.jar' --dir www/dist/ --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isPrerelease \
            --jq '{tag: .tagName, name: .name, prerelease: .isPrerelease}' > www/dist/release.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: www/dist/

      - id: deployment
        uses: actions/deploy-pages@v4
