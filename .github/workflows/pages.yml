name: Pages

on:
  # The Release workflow publishes releases using the default GITHUB_TOKEN, and GitHub
  # suppresses further workflow_dispatch-style events (like `release: published`) from
  # token-authored actions to prevent recursive runs. Chaining off `workflow_run` instead
  # is the standard workaround: it reacts to the Release run itself completing, regardless
  # of which token drove it.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - id: deployment
        uses: actions/deploy-pages@v4
