name: Docker/k6 integration

on:
  push:
    branches: [main]
    paths: &docker-k6-paths
      - 'modules/app/**'
      - 'modules/k6/**'
      - 'pom.xml'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - '.github/workflows/docker-k6-integration.yml'
  pull_request:
    branches: [main]
    paths: *docker-k6-paths

concurrency:
  group: docker-k6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-k6-tests:
    name: docker-k6-tests
    runs-on: ubuntu-latest
    # Non-blocking by design: these tests exercise live Docker + a k6 binary and are more prone
    # to environmental flakiness than the core suite. Kept in its own workflow file so it can
    # never accidentally become a required status check. Docker itself is already present on
    # GitHub-hosted ubuntu-latest runners.
    continue-on-error: true
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: grafana/setup-k6-action@v1

      - name: Run Docker/k6-gated integration tests
        run: ./mvnw -B -pl modules/k6,modules/app -am clean verify

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Docker/k6 integration test results
          # Comma-separated, not brace-expanded and not one-per-line: dorny/test-reporter@v3
          # splits `path` on commas only. A `{k6,app}` brace pattern isn't expanded (it isn't a
          # shell), and a YAML `|` block is passed through as one literal string with an embedded
          # newline rather than being split into separate globs — both silently matched nothing.
          path: 'modules/k6/target/surefire-reports/TEST-*.xml,modules/app/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          list-tests: failed
          fail-on-error: false
