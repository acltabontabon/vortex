name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # frontend-maven-plugin (bound into modules/app's generate-resources phase) downloads its
      # own Node/npm and installs web/node_modules on every run unless these are cached — the
      # Maven cache above doesn't cover them.
      - uses: actions/cache@v6
        with:
          path: web/node_modules
          key: web-node-modules-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            web-node-modules-

      - uses: actions/cache@v6
        with:
          path: web/node
          key: web-node-runtime-v22.14.0

      - name: Build and test (all modules + embedded frontend)
        run: ./mvnw -B clean verify

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test results
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          # Hundreds of tests across seven modules — annotating every one (list-tests: all) rather
          # than only failures pushed the action past what it could reliably process, and it died
          # without a usable error, sinking this required check even on a fully green build.
          list-tests: failed
          fail-on-error: false

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
