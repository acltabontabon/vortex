spring:
  application:
    name: checkout-service
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  tomcat:
    threads:
      max: 400

checkout:
  # The deliberate bottleneck. A pool of 6 workers each taking ~35 ms can serve roughly
  # 170 requests/sec before requests begin to queue. See CheckoutProperties for the arithmetic,
  # and docs/03-performance-model/interpreting-results.adoc for what that looks like in a Vortex report.
  workers: 6
  downstream-latency: 35ms
  latency-jitter: 10ms
  acquire-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        # Deliberately narrow. Vortex only needs to read metrics; exposing more would be
        # convenient and wrong, even in a sample. `prometheus` is the one deliberate exception:
        # it is what the Production Reality demo stack (see docker-compose.yml) scrapes, and it is
        # exactly as read-only as `metrics` — a text dump of the same counters, in a different format.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: checkout-service
    distribution:
      # Off by default in Spring Boot — turned on here so the Production Reality demo can show
      # Vortex's diagnostic p95 latency figure (see PrometheusObservationSource#verify), not only
      # its honest "not published" refusal, which is what every service gets without this.
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.acltabontabon.vortex.demo: INFO
